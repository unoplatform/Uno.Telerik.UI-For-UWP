jobs:
- job: Packages
  timeoutInMinutes: 90
  pool:
    vmImage: 'windows-2022'

  steps:
  - checkout: self
    clean: true

  - template: templates/canary-updater.yml
  - template: templates/gitversion.yml
  - template: templates/dotnet-install-windows.yml

  - task: MSBuild@1
    inputs:
      solution: Controls/UWPControls-packages.slnf
      configuration: Release
      msbuildLocationMethod: version
      msbuildVersion: latest
      maximumCpuCount: true
      msbuildArguments: /m /v:m /r /p:GeneratePackageOnBuild=true /detailedsummary "/p:PackageOutputPath=$(build.artifactstagingdirectory)" "/p:PackageVersion=$(NBGV_SemVer2)" "/p:InformationalVersion=$(NBGV_InformationalVersion)" /bl:$(build.artifactstagingdirectory)/telerik-build-packages.binlog

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: $(build.artifactstagingdirectory)
      ArtifactName: telerik-drop
      ArtifactType: Container