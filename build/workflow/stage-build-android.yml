jobs:
- job: Android
  pool:
    vmImage: windows-2022

  steps:
  - template: templates/canary-updater.yml
  - template: templates/gitversion.yml
  - template: templates/dotnet-install-windows.yml
    parameters:
      UnoCheckParameters: '--tfm net9.0-android'

  - script: |
      cd $(build.sourcesdirectory)/SDKExamples/SDKExamples
      dotnet publish -f:net9.0-android /p:UnoTargetFrameworkOverride=net9.0-android -c:Release "/p:InformationalVersion=%NBGV_InformationalVersion%" /bl:$(build.artifactstagingdirectory)/build-android.binlog 
    displayName: 'Build Android'

  - task: CopyFiles@2
    displayName: 'Publish Binaries'
    inputs:
      SourceFolder: $(build.sourcesdirectory)/src/Chefs/bin/Release/net9.0-android
      Contents:  |
        **/*.apk
        **/*.aab
      TargetFolder: $(build.artifactstagingdirectory)
      CleanTargetFolder: false
      OverWrite: false
      flattenFolders: false

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: $(build.artifactstagingdirectory)
      ArtifactName: Android
      ArtifactType: Container